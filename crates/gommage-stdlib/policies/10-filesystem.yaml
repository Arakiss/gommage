# Filesystem policy defaults.
#
# ${EXPEDITION_ROOT} is substituted at load time with the current expedition's
# root directory (set by `gommage expedition start`). If unset, nothing under
# the project matches and these rules deny by fail-closed at the end.

# --- Fail-safe: deny traversal escapes early ----------------------------------
# Gommage treats paths as opaque strings (see docs/input-schema.md) — it does
# NOT collapse `..`. This rule covers the common attacker shape "root + ../.."
# so an agent that emits `${EXPEDITION_ROOT}/../../etc/passwd` gets gommaged
# even though the string has the EXPEDITION_ROOT prefix. Users who genuinely
# need `..` in a path must canonicalise in the agent before tool invocation.
- name: deny-dotdot-escape
  decision: gommage
  match:
    any_capability:
      - "fs.read:**/../**"
      - "fs.search:**/../**"
      - "fs.write:**/../**"
  reason: "path contains '..'; canonicalise in the agent, do not rely on string prefixes"

- name: deny-unsafe-apply-patch-payload
  decision: gommage
  match:
    any_capability:
      - "fs.patch.unparsed"
      - "fs.patch.overflow"
      - "fs.patch.absolute"
  reason: "Codex apply_patch payload was unparsed, too large, or used absolute paths; split or normalize before trusting it"

- name: no-writes-to-build-artifacts
  decision: gommage
  match:
    any_capability:
      - "fs.write:**/node_modules/**"
      - "fs.write:**/.next/**"
      - "fs.write:**/.turbo/**"
      - "fs.write:**/dist/**"
      - "fs.write:**/build/**"
      - "fs.write:**/target/**"
      - "fs.write:**/.git/**"
  reason: "build artifacts and VCS metadata are not edit targets"

- name: no-writes-to-home-dotfiles
  decision: gommage
  match:
    any_capability:
      - "fs.write:${HOME}/.*"
      - "fs.write:${HOME}/.ssh/**"
      - "fs.write:${HOME}/.aws/**"
      - "fs.write:${HOME}/.gnupg/**"
  reason: "agent must not touch user dotfiles or credential directories"

# --- Shell-rc persistence: deny writes to login/shell rc files --------------
# A write to a login/shell rc file is how an agent makes code run on every new
# shell. R2 already emits fs.write from tee/cp/redirect, so `echo x >> ~/.zshrc`
# and `tee ~/.bashrc` reach this deny. Both the literal-tilde form (the mapper
# captures `~/.zshrc` verbatim — the shell never expands it in the string) and
# the ${HOME}-prefixed and absolute /etc forms are covered. A write to a normal
# project file under EXPEDITION_ROOT is unaffected. Placed before the allow
# rules so it wins even if an rc path sits under the project root.
- name: deny-shell-rc-write
  decision: gommage
  match:
    any_capability:
      - "fs.write:~/.bashrc"
      - "fs.write:~/.zshrc"
      - "fs.write:~/.bash_profile"
      - "fs.write:~/.zshenv"
      - "fs.write:~/.profile"
      - "fs.write:~/.zprofile"
      - "fs.write:~/.config/fish/config.fish"
      - "fs.write:${HOME}/.bashrc"
      - "fs.write:${HOME}/.zshrc"
      - "fs.write:${HOME}/.bash_profile"
      - "fs.write:${HOME}/.zshenv"
      - "fs.write:${HOME}/.profile"
      - "fs.write:${HOME}/.zprofile"
      - "fs.write:${HOME}/.config/fish/config.fish"
      - "fs.write:/etc/profile"
      - "fs.write:/etc/profile.d/**"
  reason: "login/shell rc files run code on every new shell; refusing to make the agent persistent"

- name: allow-project-reads
  decision: allow
  match:
    all_capability:
      - "fs.read:${EXPEDITION_ROOT}/**"
  reason: "reads within the current expedition's root are allowed"

- name: allow-project-searches
  decision: allow
  match:
    all_capability:
      - "fs.search:${EXPEDITION_ROOT}/**"
  reason: "searches within the current expedition's root are allowed"

- name: allow-project-writes
  decision: allow
  match:
    all_capability:
      - "fs.write:${EXPEDITION_ROOT}/**"
  reason: "writes within the current expedition's root are allowed"

- name: allow-tmp-writes
  decision: allow
  match:
    any_capability:
      - "fs.write:/tmp/**"
      - "fs.write:/var/tmp/**"
  reason: "ephemeral tmp paths are fair game"

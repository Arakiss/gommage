# Git operations policy.

- name: deny-bulk-git-stage
  decision: gommage
  match:
    any_capability:
      - "git.stage:bulk"
  reason: "Do not stage the whole tree. Stage explicit paths instead, for example `git add path/to/file.rs path/to/test.rs`."

# Deleting a remote branch destroys shared work and is not recoverable from
# the local clone alone. Gate it for every branch, not only the protected ones:
# an agent that deletes a colleague's feature branch has done real damage even
# though pushing to that same branch is allowed.
- name: gate-remote-branch-delete
  decision: ask_picto
  required_scope: "git.push.delete"
  match:
    any_capability:
      - "git.push.delete:*"
  reason: "deleting a remote branch destroys shared history; require a signed picto (scope git.push.delete)"

- name: gate-main-push
  decision: ask_picto
  required_scope: "git.push:main"
  match:
    any_capability:
      - "git.push:refs/heads/main"
      - "git.push:refs/heads/master"
  reason: "pushes to main/master require a signed picto"

- name: gate-release-push
  decision: ask_picto
  required_scope: "git.push:release"
  match:
    any_capability:
      - "git.push:refs/heads/release/*"
      - "git.push:refs/heads/release-*"
  reason: "pushes to release branches require a signed picto"

- name: allow-feature-push
  decision: allow
  match:
    any_capability:
      - "git.push:refs/heads/feature/**"
      - "git.push:refs/heads/fix/**"
      - "git.push:refs/heads/chore/**"
      - "git.push:refs/heads/docs/**"
  reason: "feature/fix/chore/docs branches are safe"

- name: ask-reset-hard
  decision: ask_picto
  required_scope: "git.reset.hard"
  match:
    any_capability:
      - "git.reset.hard:*"
  reason: "git reset --hard is destructive; require picto"

# --- Config hijack ----------------------------------------------------------
# Setting `url.<x>.insteadOf` silently rewrites every remote (exfil/MITM), and
# `core.hooksPath` / `core.fsmonitor` point git at an arbitrary executable that
# runs on routine git operations. Gate with a picto; ordinary
# `git config user.name X` / `git config --list` surface no capability and stay
# free.
- name: gate-git-config-hijack
  decision: ask_picto
  required_scope: "git.config:hijack"
  match:
    any_capability:
      - "git.config:hijack"
  reason: "git config setting url.insteadOf / core.hooksPath / core.fsmonitor can hijack remotes or run code; require a picto"

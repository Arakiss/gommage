# Package manager policy defaults.

- name: allow-package-manager-information
  decision: allow
  match:
    any_capability:
      - "proc.exec:cargo publish --help"
      - "proc.exec:cargo publish -h"
      - "proc.exec:cargo publish --version"
      - "proc.exec:cargo install --help"
      - "proc.exec:cargo install -h"
      - "proc.exec:cargo help publish"
      - "proc.exec:cargo help install"
      - "proc.exec:cargo --help publish"
      - "proc.exec:cargo --help install"
      - "proc.exec:npm publish --help"
      - "proc.exec:npm publish -h"
      - "proc.exec:npm install --help"
      - "proc.exec:npm install -h"
      - "proc.exec:bun publish --help"
      - "proc.exec:bun publish -h"
      - "proc.exec:bun add --help"
      - "proc.exec:bun add -h"
      - "proc.exec:twine upload --help"
      - "proc.exec:twine upload -h"
      - "proc.exec:pip upload --help"
      - "proc.exec:pip upload -h"
      - "proc.exec:python -m twine upload --help"
      - "proc.exec:python3 -m twine upload --help"
      - "proc.exec:./scripts/publish-crates.sh --execute --help"
      - "proc.exec:sh scripts/publish-crates.sh --help --execute"
    none_capability:
      - "pkg.bun:publish"
      - "pkg.npm:publish"
      - "pkg.cargo:publish"
      - "pkg.python:publish"
      - "proc.exec.ambiguous:*"
  reason: "known package-manager help and version forms exit before mutation"

- name: allow-bun-install
  decision: allow
  match:
    all_capability:
      - "pkg.bun:install"
      - "net.out:registry.npmjs.org"
      - "proc.exec:**bun **"
  reason: "bun install is a normal operation in this project family"

- name: allow-npm-install
  decision: allow
  match:
    all_capability:
      - "pkg.npm:install"
      - "net.out:registry.npmjs.org"
      - "proc.exec:**npm **"
  reason: "npm install is a normal operation"

- name: ask-cargo-install-global
  decision: ask_picto
  required_scope: "pkg.cargo:install"
  match:
    all_capability:
      - "pkg.cargo:install"
      - "net.out:crates.io"
      - "proc.exec:**cargo install**"
  reason: "global cargo install touches ~/.cargo/bin; require picto"

# --- Supply-chain publish: irreversible registry mutation -------------------
# Publishing a package to a public registry cannot be undone (versions are
# immutable). Gate the publish verb with a picto; install/build/test stay free.

- name: gate-bun-publish
  decision: ask_picto
  required_scope: "pkg.bun:publish"
  match:
    all_capability:
      - "pkg.bun:publish"
      - "net.out:registry.npmjs.org"
      - "proc.exec:**bun publish**"
  reason: "bun publish pushes to the public registry; a published version cannot be replaced"

- name: gate-npm-publish
  decision: ask_picto
  required_scope: "pkg.npm:publish"
  match:
    all_capability:
      - "pkg.npm:publish"
      - "net.out:registry.npmjs.org"
      - "proc.exec:**npm publish**"
  reason: "npm publish pushes to the public registry; a published version cannot be unpublished"

- name: gate-cargo-publish
  decision: ask_picto
  required_scope: "pkg.cargo:publish"
  match:
    all_capability:
      - "pkg.cargo:publish"
      - "net.out:crates.io"
      - "proc.exec:**cargo publish**"
  reason: "cargo publish pushes to crates.io; a published version is permanent"

- name: gate-gommage-crates-publish-script
  decision: ask_picto
  required_scope: "pkg.cargo:publish"
  match:
    all_capability:
      - "pkg.cargo:publish"
      - "net.out:crates.io"
      - "proc.exec:**scripts/publish-crates.sh**--execute**"
  reason: "the crates publish helper executes permanent crates.io publishes"

- name: gate-python-publish
  decision: ask_picto
  required_scope: "pkg.python:publish"
  match:
    all_capability:
      - "pkg.python:publish"
      - "net.out:pypi.org"
      - "proc.exec:**twine upload**"
  reason: "twine/pip upload pushes to PyPI; a published version cannot be replaced"

- name: gate-python-module-publish
  decision: ask_picto
  required_scope: "pkg.python:publish"
  match:
    all_capability:
      - "pkg.python:publish"
      - "net.out:pypi.org"
      - "proc.exec:**python** -m twine upload**"
  reason: "python -m twine upload pushes a permanent package to PyPI"

- name: gate-pip-publish
  decision: ask_picto
  required_scope: "pkg.python:publish"
  match:
    all_capability:
      - "pkg.python:publish"
      - "net.out:pypi.org"
      - "proc.exec:**pip** upload**"
  reason: "pip upload pushes a permanent package to PyPI"

# Recovery policy defaults.
#
# These rules intentionally load after hard-stops and native deny imports, but
# before broader stdlib policies. They keep an agent able to inspect and repair
# a Gommage installation without turning the shell into a blanket allow-list.

- name: allow-gommage-readiness-commands
  decision: allow
  match:
    any_capability:
      - "proc.exec:gommage --help*"
      - "proc.exec:gommage -h*"
      - "proc.exec:gommage --version*"
      - "proc.exec:gommage -V*"
      - "proc.exec:gommage verify*"
      - "proc.exec:gommage doctor*"
      - "proc.exec:gommage smoke*"
      - "proc.exec:gommage policy check*"
      - "proc.exec:gommage agent status*"
      - "proc.exec:gommage daemon status*"
    all_capability:
      - "proc.exec:gommage *"
  reason: "Gommage readiness and recovery commands must remain available after quickstart"

- name: allow-absolute-gommage-readiness-commands
  decision: allow
  match:
    any_capability:
      - "proc.exec:**/gommage --help*"
      - "proc.exec:**/gommage -h*"
      - "proc.exec:**/gommage --version*"
      - "proc.exec:**/gommage -V*"
      - "proc.exec:**/gommage verify*"
      - "proc.exec:**/gommage doctor*"
      - "proc.exec:**/gommage smoke*"
      - "proc.exec:**/gommage policy check*"
      - "proc.exec:**/gommage agent status*"
      - "proc.exec:**/gommage daemon status*"
    all_capability:
      - "proc.exec:**/gommage *"
  reason: "absolute Gommage binary paths are valid recovery commands"

- name: allow-pwd-inspection
  decision: allow
  match:
    any_capability:
      - "proc.exec:pwd"
      - "proc.exec:pwd *"
    all_capability:
      - "proc.exec:pwd*"
  reason: "the current directory must stay inspectable during recovery"

- name: allow-ls-inspection
  decision: allow
  match:
    any_capability:
      - "proc.exec:ls"
      - "proc.exec:ls *"
    all_capability:
      - "proc.exec:ls*"
  reason: "directory listings must stay available during recovery"

- name: allow-gommage-path-inspection
  decision: allow
  match:
    any_capability:
      - "proc.exec:command -v gommage*"
      - "proc.exec:which gommage*"
    all_capability:
      - "proc.exec:*gommage*"
  reason: "the active Gommage binary path must stay inspectable during recovery"

- name: allow-gommage-systemd-status
  decision: allow
  match:
    all_capability:
      - "proc.exec:systemctl --user status gommage-daemon.service*"
  reason: "the user-level Gommage daemon must stay inspectable during recovery"

- name: allow-claude-settings-inspection
  decision: allow
  match:
    any_capability:
      - "proc.exec:cat ~/.claude/settings.json"
      - "proc.exec:cat ${HOME}/.claude/settings.json"
    all_capability:
      - "fs.read:${HOME}/.claude/settings.json"
  reason: "Claude settings must be inspectable during recovery"

- name: allow-claude-settings-backup-cat
  decision: allow
  match:
    any_capability:
      - "proc.exec:cat ~/.claude/settings.json.gommage-bak-*"
      - "proc.exec:cat ${HOME}/.claude/settings.json.gommage-bak-*"
    all_capability:
      - "fs.read:${HOME}/.claude/settings.json.gommage-bak-*"
  reason: "Claude settings backups must be readable during recovery"

- name: allow-claude-settings-backup-list
  decision: allow
  match:
    any_capability:
      - "proc.exec:ls ~/.claude/settings.json.gommage-bak-*"
      - "proc.exec:ls ${HOME}/.claude/settings.json.gommage-bak-*"
    all_capability:
      - "proc.exec:ls *settings.json.gommage-bak-*"
  reason: "Claude settings backups must be discoverable during recovery"

# Capability mappers for the `Bash` tool.
#
# Each rule matches the `command` field against a regex. When it fires, the
# rule emits one or more capability strings. Multiple rules may fire for the
# same call — that is fine, all their emissions go into the capability set.

# --- Default: every Bash call is proc.exec:<command> ---------------------------
- name: bash-proc-exec
  tool: Bash
  emit:
    - "proc.exec:${input.command}"

# Gommage's own authorization, reconfiguration, and disable operations are
# emitted as exact `gommage.*` capabilities by the quote-preserving AST
# analyzer. They intentionally have no regex duplicate in this mapper pack.

# --- Git --------------------------------------------------------------------
# Push destinations, deletion, force semantics, and network effects are emitted
# directly from the quote-preserving shell AST in gommage-core. Keeping a regex
# copy here would create contradictory branch capabilities for refspecs.

- name: bash-git-reset-hard
  tool: Bash
  match_input:
    command: "^\\s*git\\s+reset\\s+--hard\\b"
  emit:
    - "git.reset.hard:<any>"

- name: bash-git-add-bulk
  tool: Bash
  match_input:
    command: "^\\s*git\\s+add\\s+(?:--all|-A|--update|-u|\\.)(?:\\s|$)"
  emit:
    - "git.stage:bulk"

# --- Package managers -------------------------------------------------------
- name: bash-bun-install
  tool: Bash
  match_input:
    command: "^\\s*bun\\s+(?:install|add|remove)\\b"
  emit:
    - "pkg.bun:install"
    - "net.out:registry.npmjs.org"

- name: bash-npm-install
  tool: Bash
  match_input:
    command: "^\\s*npm\\s+(?:install|i|add|remove|uninstall)\\b"
  emit:
    - "pkg.npm:install"
    - "net.out:registry.npmjs.org"

- name: bash-cargo-install
  tool: Bash
  match_input:
    command: "^\\s*cargo\\s+install\\b"
  emit:
    - "pkg.cargo:install"
    - "net.out:crates.io"

# --- Supply-chain PUBLISH (irreversible registry mutation) -------------------
#
# These gate only the *publish* verb, not install/build/test. They surface a
# `pkg.<registry>:publish` capability that the package-manager policy gates with
# a picto. Run per shell-segment, so `cd /pkg && npm publish` is caught too.

# npm publish -> pkg.npm:publish (NOT `npm install`/`npm run`/`npm test`).
- name: bash-npm-publish
  tool: Bash
  match_input:
    command: "^\\s*npm\\s+publish\\b"
  emit:
    - "pkg.npm:publish"
    - "net.out:registry.npmjs.org"

# cargo publish -> pkg.cargo:publish (NOT `cargo build`/`cargo test`).
- name: bash-cargo-publish
  tool: Bash
  match_input:
    command: "^\\s*cargo\\s+publish\\b"
  emit:
    - "pkg.cargo:publish"
    - "net.out:crates.io"

# The local helper wraps real `cargo publish` calls. Treat its execute mode as
# the same irreversible registry mutation so operators cannot bypass the cargo
# publish gate by moving the verb into a shell script.
- name: bash-gommage-publish-crates-script
  tool: Bash
  match_input:
    command: "^\\s*(?:(?:sh|bash)\\s+)?(?:\\./)?scripts/publish-crates\\.sh\\b[^#;|&]*\\s--execute\\b"
  emit:
    - "pkg.cargo:publish"
    - "net.out:crates.io"

# Python publish: `twine upload`, `python -m twine upload`, `pip ... upload`.
- name: bash-python-publish
  tool: Bash
  match_input:
    command: "^\\s*(?:twine\\s+upload|python[0-9.]*\\s+-m\\s+twine\\s+upload|pip[0-9.]*\\s+.*\\bupload\\b)"
  emit:
    - "pkg.python:publish"
    - "net.out:pypi.org"

# --- Persistence verbs (scheduler / service registration) --------------------
#
# Gate the *write* variants that install a recurring job or daemon; the
# read/inspect variants (`crontab -l`, `launchctl list`, `systemctl status`)
# are deliberately not surfaced here.

# `crontab -e` (interactive edit) or `crontab <file>` (install a crontab) ->
# sched.cron:edit. `crontab -l` (list) and `crontab -r` are NOT matched: the
# negative lookahead-free form below requires either `-e` or a non-flag file
# argument, and explicitly excludes a lone `-l`/`-r`.
- name: bash-crontab-edit-flag
  tool: Bash
  match_input:
    command: "^\\s*crontab\\s+(?:-\\S+\\s+)*-e\\b"
  emit:
    - "sched.cron:edit"

# `crontab <file>` — first non-flag argument that is not l/r/e is a crontab file
# being installed. Excludes `crontab -l`, `crontab -r`, `crontab -e` (the flag
# form is handled above) by requiring a non-dash first token.
- name: bash-crontab-file
  tool: Bash
  match_input:
    command: "^\\s*crontab\\s+(?P<file>[^-\\s][^\\s]*)\\s*$"
  emit:
    - "sched.cron:edit"

# launchctl load|bootstrap|enable -> sched.launchd:write (NOT list/print/status).
- name: bash-launchctl-write
  tool: Bash
  match_input:
    command: "^\\s*launchctl\\s+(?:load|bootstrap|enable)\\b"
  emit:
    - "sched.launchd:write"

# systemctl (system scope: default, or explicit --system) enable|start|
# daemon-reload -> sched.systemd:write. The `--user` scope is NOT matched here
# (a leading `--user` token makes the head-anchored regex fail), so user units
# stay ungated. NOT status/list-units/show/cat (read-only verbs).
- name: bash-systemctl-system-write
  tool: Bash
  match_input:
    command: "^\\s*systemctl\\s+(?:--system\\s+)?(?:enable|start|daemon-reload)\\b"
  emit:
    - "sched.systemd:write"

# --- Cloud / deploy ---------------------------------------------------------
- name: bash-vercel-deploy
  tool: Bash
  match_input:
    command: "^\\s*vercel\\s+(?:deploy|--prod|deploy\\s+--prod)"
  emit:
    - "deploy.vercel:<prod-or-preview>"
    - "net.out:vercel.com"

- name: bash-docker-push
  tool: Bash
  match_input:
    command: "^\\s*docker\\s+push\\s+(?P<image>\\S+)"
  emit:
    - "docker.push:${image}"

# --- Docker container-escape shapes -----------------------------------------
#
# Gate ONLY the escape-enabling flags of `docker run`; ordinary
# `docker run <image>` and a project-dir bind mount stay ungated.

# `docker run ... --privileged` grants the container near-host capabilities.
- name: bash-docker-run-privileged
  tool: Bash
  match_input:
    command: "^\\s*docker\\s+run\\b[^#]*\\s--privileged\\b"
  emit:
    - "docker.run.privileged"

# `docker run` mounting the host root `/` or `/etc` grants host-filesystem
# escape. Matches `-v` and `--volume`, both `-v /:...` (root) and `-v /etc...`.
# A project-dir mount (`-v $(pwd):/app`, `-v ./data:/data`) does NOT match.
- name: bash-docker-run-hostmount
  tool: Bash
  match_input:
    command: "^\\s*docker\\s+run\\b[^#]*\\s(?:-v|--volume)[=\\s]/(?::|etc(?:/|:))"
  emit:
    - "docker.run.hostmount"

# `docker run` mounting the Docker socket grants daemon-control escape.
- name: bash-docker-run-hostmount-socket
  tool: Bash
  match_input:
    command: "^\\s*docker\\s+run\\b[^#]*/var/run/docker\\.sock\\b"
  emit:
    - "docker.run.hostmount"

# --- Destructive shell patterns (surfaced so policy/hardstop can see them) --
- name: bash-rm-rf
  tool: Bash
  match_input:
    command: "(?P<full>^.*\\brm\\s+-rf\\b.*)"
  emit:
    - "proc.exec:${full}"

- name: bash-curl-pipe-shell
  tool: Bash
  match_input:
    command: "curl\\s+[^|]*\\|\\s*(?:sh|bash|zsh)"
  emit:
    - "proc.exec.curl-pipe-sh:<any>"
    - "net.out:<untrusted>"

# --- Filesystem effects through Bash ----------------------------------------
#
# Reads, writes, redirects, and raw-device destinations are emitted directly
# from the quote-preserving shell AST in gommage-core. Regex copies are omitted
# so a call has one canonical destination capability when cwd context exists.

# --- Exfil / egress (data leaving the host) ----------------------------------
#
# Each rule fires per shell segment (the mapper runs every rule against each
# prefix-stripped candidate), so `cd /x && scp f host:/p` gates too. The shape
# being gated is "data leaves to a remote endpoint"; routine local/GET forms are
# left ungated by the guards below and stay free.

# scp with a remote target: an argument of the form `host:` or `user@host:`
# (the scp remote convention). `scp a b` (both local, no colon) does NOT match.
- name: bash-scp-remote
  tool: Bash
  match_input:
    command: "^\\s*scp\\b[^#]*\\s(?:[\\w.-]+@)?[\\w][\\w.-]*:"
  emit:
    - "net.scp:out"

# rsync with a remote target: a `host:`/`user@host:` argument or an `rsync://`
# URL. `rsync a b` (both local) does NOT match.
- name: bash-rsync-remote
  tool: Bash
  match_input:
    command: "^\\s*rsync\\b[^#]*\\s(?:rsync://|(?:[\\w.-]+@)?[\\w][\\w.-]*:)"
  emit:
    - "net.rsync:out"

# ssh that runs a remote COMMAND (a non-option positional after the host) or
# opens a port-forward tunnel (`-L`/`-R`/`-D`). A bare `ssh host` (interactive
# login, no trailing command, no tunnel flag) does NOT match.
- name: bash-ssh-tunnel
  tool: Bash
  match_input:
    command: "^\\s*ssh\\b[^#]*\\s-[LRD]\\b"
  emit:
    - "net.ssh:exec"

# ssh host <command>: after the `[user@]host` token, a trailing non-option word
# is a remote command. Best-effort and conservative: value-taking flags
# (`-p -i -o -l -F -c -m -b -e -B -E -J -Q -S -W`) MUST consume their argument
# so a port number is never mistaken for the host; boolean flags
# (`-4 -6 -A -a -C -f -G -g -K -k -M -N -n -q -s -T -t -V -v -X -x -Y -y`) take
# none. The first bare token after all flags is the host; a *further* non-flag
# token is the remote command. A bare `ssh host` (no trailing command) and
# `ssh -p 2222 host` (flag+value, no command) do NOT match.
- name: bash-ssh-remote-command
  tool: Bash
  match_input:
    command: "^\\s*ssh(?:\\s+(?:-[pioFlcmbeBEJQSW]\\s*\\S+|-[46AaCfGgKkMNnqsTtVvXxYy]+))*\\s+(?:[\\w.-]+@)?[\\w][\\w.-]*\\s+(?P<cmd>[^-\\s][^\\s]*)"
  emit:
    - "net.ssh:exec"

# curl with an upload/POST flag: `-d`/`--data*`, `-F`/`--form`, `-T`/
# `--upload-file`, or an explicit `-X POST`/`-X PUT`. A plain `curl https://x`
# (GET) does NOT match.
- name: bash-curl-upload
  tool: Bash
  match_input:
    command: "^\\s*curl\\b[^#]*\\s(?:-d\\b|--data(?:-\\w+|=|\\b)|-F\\b|--form\\b|-T\\b|--upload-file\\b|-X\\s+(?:POST|PUT))"
  emit:
    - "net.out.post"

# wget with a POST/body flag. A plain `wget https://x` (GET) does NOT match.
- name: bash-wget-post
  tool: Bash
  match_input:
    command: "^\\s*wget\\b[^#]*\\s(?:--post-data\\b|--post-data=|--post-file\\b|--post-file=|--method=POST|--body-data\\b|--body-data=|--body-file\\b|--body-file=)"
  emit:
    - "net.out.post"

# --- Permissions: dangerous chmod / chown variants ---------------------------
#
# Gate ONLY the recursive or over-broad variant; a single-file `chmod +x`,
# `chmod 644`, `chmod u+w`, or `chown me f` stays ungated.

# chmod -R / --recursive, OR a world-writable mode: octal `777`/`0777` (any
# leading owner/group digits with a world digit granting write — `2`/`3`/`6`/`7`
# in the last position), or the symbolic `a+w` / `o+w`. The symbolic `u+w`
# (owner write), `g+w` (group write), `+x`, and octal `644` are NOT world-write
# and stay ungated.
- name: bash-chmod-recursive
  tool: Bash
  match_input:
    command: "^\\s*chmod\\b[^#]*(?:\\s-R\\b|\\s--recursive\\b)"
  emit:
    - "fs.chmod:dangerous"

# World-writable MODE in the mode position (first non-flag arg), so a file that
# merely happens to be named like an octal (e.g. `chmod +x 777`) is not gated.
- name: bash-chmod-world-write-mode
  tool: Bash
  match_input:
    command: "^\\s*chmod\\b(?:\\s+-{1,2}[A-Za-z][\\w-]*)*\\s+(?:0?[0-7][0-7][2367]\\b|[ao]\\+[rwxXst]*w[rwxXst]*\\b)"
  emit:
    - "fs.chmod:dangerous"

# chown -R / --recursive, OR a target user/group of root (`root`, `root:`,
# `:root`, `root:root`). `chown me f` (non-root, non-recursive) stays ungated.
- name: bash-chown-dangerous
  tool: Bash
  match_input:
    command: "^\\s*chown\\b[^#]*\\s(?:-R\\b|--recursive\\b|root\\b|root:|:root\\b|0\\b|0:)"
  emit:
    - "fs.chown:dangerous"

# --- Config hijack: git config setting a dangerous key -----------------------
#
# `git config` SETTING `url.<x>.insteadOf`, `core.hookspath`, or
# `core.fsmonitor` lets an attacker silently rewrite remotes or run code on
# every git operation. `git config user.name X` / `git config --list` (read)
# do NOT match.
- name: bash-git-config-hijack
  tool: Bash
  match_input:
    command: "(?i)^\\s*git\\s+config\\b(?:\\s+--\\S+)*\\s+(?:url\\.[^\\s]*\\.insteadof|core\\.hookspath|core\\.fsmonitor)\\b"
  emit:
    - "git.config:hijack"

# --- Code injection: dynamic-loader preload env prefix -----------------------
#
# An env-assignment prefix that sets LD_PRELOAD / DYLD_INSERT_LIBRARIES /
# DYLD_LIBRARY_PATH forces a shared library into every spawned process — a
# classic code-injection vector. This MUST match candidate 0 (the whole
# command), because the shell-aware command_words strips env-assignment
# prefixes from the per-segment candidates; the raw command still carries them.
# An ordinary `FOO=bar mycmd` env prefix does NOT match.
- name: bash-env-inject-preload
  tool: Bash
  match_input:
    command: "(?:^|[;&|]|\\bsudo\\b|\\benv\\b)\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*(?:LD_PRELOAD|DYLD_INSERT_LIBRARIES|DYLD_LIBRARY_PATH)="
  emit:
    - "proc.env.inject:preload"

- name: bash-env-gommage-bypass
  tool: Bash
  match_input:
    command: "(?:^|[;&|]|\\bsudo\\b|\\benv\\b|\\bexport\\b)\\s*(?:[A-Za-z_][A-Za-z0-9_]*=\\S*\\s+)*GOMMAGE_BYPASS="
  emit:
    - "proc.env.gommage_bypass"

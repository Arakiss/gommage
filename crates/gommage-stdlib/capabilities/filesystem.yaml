# Capability mappers for filesystem-shaped tool calls.
#
# Claude Code and Cursor both use Read / Write / Edit with a `file_path` field.
# Other agents may use slightly different schemas — extend via local overrides
# in ~/.gommage/capabilities.d/.

- name: fs-read
  tool: Read
  emit:
    - "fs.read:${input.file_path}"

- name: fs-read-resolved
  tool: Read
  match_input:
    __gommage_file_path: ".+"
  emit:
    - "fs.read:${input.__gommage_file_path}"

- name: fs-write
  tool: Write
  emit:
    - "fs.write:${input.file_path}"

- name: fs-write-resolved
  tool: Write
  match_input:
    __gommage_file_path: ".+"
  emit:
    - "fs.write:${input.__gommage_file_path}"

- name: fs-edit
  tool: Edit
  emit:
    - "fs.write:${input.file_path}"

- name: fs-edit-resolved
  tool: Edit
  match_input:
    __gommage_file_path: ".+"
  emit:
    - "fs.write:${input.__gommage_file_path}"

- name: fs-multi-edit
  tool: MultiEdit
  emit:
    - "fs.write:${input.file_path}"

- name: fs-multi-edit-resolved
  tool: MultiEdit
  match_input:
    __gommage_file_path: ".+"
  emit:
    - "fs.write:${input.__gommage_file_path}"

- name: fs-notebook-edit
  tool: NotebookEdit
  emit:
    - "fs.write:${input.notebook_path}"

- name: fs-notebook-edit-resolved
  tool: NotebookEdit
  match_input:
    __gommage_notebook_path: ".+"
  emit:

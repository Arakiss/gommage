name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '45 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_TIME: ${{ github.event_name == 'schedule' && '600' || '60' }}

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - mapper_and_evaluator
          - configuration_parsers
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly-2026-07-01
          profile: minimal
      - name: Cache Rust build state
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "${CARGO_FUZZ_VERSION}" --locked
      - name: Validate seed corpus
        run: cargo test --manifest-path fuzz/Cargo.toml
      - name: Build target
        run: cargo fuzz build "${{ matrix.target }}"
      - name: Run target
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cargo fuzz run "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" \
            "fuzz/seeds/${{ matrix.target }}" -- \
            -max_total_time="${FUZZ_TIME}" \
            -rss_limit_mb=3072
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: ignore
          path: fuzz/artifacts/

name: ci

on:
  push:
    branches: [main]
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # `pull_request_target` uses the base ref (`refs/heads/main`), so include the
  # event and PR number to avoid cancelling in-flight `push` CI on main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GOMMAGE_CHECKOUT_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.ref }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  determinism:
    # Determinism claim lives or dies by this matrix. Run the full forward +
    # shuffled sweep 10× per combination of (OS, locale). Any divergence is a
    # contract violation, not a flake.
    name: determinism sweep (x10) — ${{ matrix.os }} / ${{ matrix.locale }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            locale: C
          - os: ubuntu-latest
            locale: en_US.UTF-8
          - os: ubuntu-latest
            locale: de_DE.UTF-8
          - os: macos-latest
            locale: C
          - os: macos-latest
            locale: en_US.UTF-8
    env:
      LC_ALL: ${{ matrix.locale }}
      LANG:   ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install non-default locale (Linux)
        if: runner.os == 'Linux' && matrix.locale != 'C'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update && \
               sudo timeout 180s apt-get install -y --no-install-recommends locales; then
              break
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "locale package installation failed after $attempt attempts"
              exit 1
            fi

            sleep $((attempt * 10))
          done
          sudo locale-gen "${{ matrix.locale }}"
      - name: 10× forward + shuffled
        run: |
          for i in $(seq 1 10); do
            echo "--- sweep $i ---"
            cargo test -p gommage-core --test determinism -- --test-threads=1
          done

  # Umbrella job: single required status check that succeeds iff every row of
  # the determinism matrix above succeeded. Keeps branch protection sane (one
  # name to list) while the matrix expands or contracts freely.
  determinism-all:
    name: determinism sweep (all)
    runs-on: ubuntu-latest
    needs: determinism
    if: ${{ always() && (github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))) }}
    steps:
      - name: Roll up matrix result
        run: |
          if [[ "${{ needs.determinism.result }}" != "success" ]]; then
            echo "determinism matrix status: ${{ needs.determinism.result }}"
            exit 1
          fi
          echo "determinism matrix all green"

  policy-lint:
    name: policy lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify internal workspace dependency pins
        run: sh scripts/sync-workspace-internal-deps.sh --check
      - name: Verify living docs avoid pinned release drift
        run: sh scripts/check-doc-release-refs.sh
      - name: Verify installer release resolution
        run: sh scripts/check-installer-release-resolution.sh
      - name: Verify stdlib root mirrors
        run: |
          diff -ru policies crates/gommage-stdlib/policies
          diff -ru capabilities crates/gommage-stdlib/capabilities
      - run: cargo build -p gommage-cli
      - name: Verify agent command contracts
        run: GOMMAGE_BIN=./target/debug/gommage sh scripts/check-agent-command-contracts.sh
      - name: Init home and install shipped stdlib
        run: |
          export GOMMAGE_HOME="$RUNNER_TEMP/.gommage"
          ./target/debug/gommage init
          ./target/debug/gommage policy init --stdlib
          ./target/debug/gommage policy check
      - name: Verify public policy fixture library
        run: GOMMAGE_BIN=./target/debug/gommage sh scripts/check-public-policy-fixtures.sh

  operator-smoke:
    name: operator smoke (${{ matrix.os }} / ${{ matrix.agent }})
    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            agent: claude
            daemon_manager: systemd
          - os: ubuntu-latest
            agent: codex
            daemon_manager: systemd
          - os: macos-latest
            agent: claude
            daemon_manager: launchd
          - os: macos-latest
            agent: codex
            daemon_manager: launchd
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug binaries
        run: cargo build --workspace
      - name: Host smoke
        run: |
          GOMMAGE_BIN=target/debug/gommage sh scripts/host-smoke.sh \
            --temp-home \
            --agent "${{ matrix.agent }}" \
            --daemon-manager "${{ matrix.daemon_manager }}" \
            --capture-dir "host-smoke-${{ matrix.os }}-${{ matrix.agent }}"
      - name: Launch demo
        if: matrix.agent == 'claude'
        run: |
          GOMMAGE_BIN=target/debug/gommage sh scripts/launch-demo.sh \
            --capture-dir "launch-demo-${{ matrix.os }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: operator-smoke-${{ matrix.os }}-${{ matrix.agent }}
          if-no-files-found: ignore
          path: |
            host-smoke-${{ matrix.os }}-${{ matrix.agent }}
            launch-demo-${{ matrix.os }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  semver-checks:
    name: cargo-semver-checks (gommage-core)
    runs-on: ubuntu-latest
    # Only run on PRs against main — baseline is the target branch tip.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
          fetch-depth: 0            # full history so baseline-rev can check out main
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: gommage-core
          # `gommage-core` is not on crates.io yet, so the default baseline
          # (latest published version) doesn't exist. Compare against the PR
          # target branch instead: any breaking API change vs that tip fails
          # the check. When we publish to crates.io, this line can go away
          # and the action reverts to the published-version baseline.
          #
          # Use the fully-qualified remote ref so the rev resolves without
          # needing a local branch (fetch-depth: 0 only brings remotes).
          baseline-rev: origin/${{ github.base_ref }}

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--branches--'))) && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GOMMAGE_CHECKOUT_REF }}
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.yaml
          failOnWarnings: true

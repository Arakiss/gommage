name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 120
  CARGO_HTTP_MULTIPLEXING: false
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          # Keep the required check name stable while pinning the actual runner
          # to avoid macos-latest image migration churn.
          - os: macos-latest
            runner: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  determinism:
    # Determinism claim lives or dies by this matrix. Run the full forward +
    # shuffled sweep 10× per combination of (OS, locale). Any divergence is a
    # contract violation, not a flake.
    name: determinism sweep (x10) — ${{ matrix.os }} / ${{ matrix.locale }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            locale: C
          - os: ubuntu-latest
            runner: ubuntu-latest
            locale: en_US.UTF-8
          - os: ubuntu-latest
            runner: ubuntu-latest
            locale: de_DE.UTF-8
          - os: macos-latest
            runner: macos-15
            locale: C
          - os: macos-latest
            runner: macos-15
            locale: en_US.UTF-8
    env:
      LC_ALL: ${{ matrix.locale }}
      LANG:   ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install non-default locale (Linux)
        if: runner.os == 'Linux' && matrix.locale != 'C'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180s apt-get update && \
               sudo timeout 180s apt-get install -y --no-install-recommends locales; then
              break
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "locale package installation failed after $attempt attempts"
              exit 1
            fi

            sleep $((attempt * 10))
          done
          sudo locale-gen "${{ matrix.locale }}"
      - name: 10× forward + shuffled
        run: |
          for i in $(seq 1 10); do
            echo "--- sweep $i ---"
            cargo test -p gommage-core --test determinism -- --test-threads=1
          done

  # Umbrella job: single required status check that succeeds iff every row of
  # the determinism matrix above succeeded. Keeps branch protection sane (one
  # name to list) while the matrix expands or contracts freely.
  determinism-all:
    name: determinism sweep (all)
    runs-on: ubuntu-latest
    needs: determinism
    if: ${{ always() }}
    steps:
      - name: Roll up matrix result
        run: |
          if [[ "${{ needs.determinism.result }}" != "success" ]]; then
            echo "determinism matrix status: ${{ needs.determinism.result }}"
            exit 1
          fi
          echo "determinism matrix all green"

  policy-lint:
    name: policy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify internal workspace dependency pins
        run: sh scripts/sync-workspace-internal-deps.sh --check
      - name: Verify crates.io publish readiness
        run: sh scripts/check-crates-publish-readiness.sh
      - name: Verify living docs avoid pinned release drift
        run: sh scripts/check-doc-release-refs.sh
      - name: Verify local-only agent files are not tracked
        run: sh scripts/check-local-agent-files.sh
      - name: Verify immutable GitHub Action pins
        run: sh scripts/check-workflow-action-pins.sh
      - name: Verify release authority boundaries
        run: sh scripts/check-release-authority-boundaries.sh
      - name: Verify SemVer workflow is not a no-op
        run: |
          sh scripts/check-semver-workflow.sh
          sh scripts/test-select-semver-release-type.sh
      - name: Verify installer release resolution
        run: sh scripts/check-installer-release-resolution.sh
      - name: Verify stdlib root mirrors
        run: |
          diff -ru policies crates/gommage-stdlib/policies
          diff -ru capabilities crates/gommage-stdlib/capabilities
      - run: cargo build -p gommage-cli
      - name: Verify agent command contracts
        run: GOMMAGE_BIN=./target/debug/gommage sh scripts/check-agent-command-contracts.sh
      - name: Init home and install shipped stdlib
        run: |
          export GOMMAGE_HOME="$RUNNER_TEMP/.gommage"
          ./target/debug/gommage init
          ./target/debug/gommage policy init --stdlib
          ./target/debug/gommage policy check
      - name: Verify public policy fixture library
        run: GOMMAGE_BIN=./target/debug/gommage sh scripts/check-public-policy-fixtures.sh

  agent-evals:
    name: agent-facing evals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build CLI for eval target
        run: cargo build -p gommage-cli
      - name: Run Promptfoo CLI contract evals
        run: |
          GOMMAGE_BIN=./target/debug/gommage \
            bunx promptfoo@0.121.19 eval \
              -c evals/promptfooconfig.yaml \
              --no-progress-bar \
              --no-table \
              --no-cache \
              --no-write

  operator-smoke:
    name: operator smoke (${{ matrix.os }} / ${{ matrix.agent }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            agent: claude
            daemon_manager: systemd
          - os: ubuntu-latest
            runner: ubuntu-latest
            agent: codex
            daemon_manager: systemd
          - os: macos-latest
            runner: macos-15
            agent: claude
            daemon_manager: launchd
          - os: macos-latest
            runner: macos-15
            agent: codex
            daemon_manager: launchd
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build debug binaries
        run: cargo build --workspace
      - name: Host smoke
        run: |
          GOMMAGE_BIN=target/debug/gommage sh scripts/host-smoke.sh \
            --temp-home \
            --agent "${{ matrix.agent }}" \
            --daemon-manager "${{ matrix.daemon_manager }}" \
            --capture-dir "host-smoke-${{ matrix.os }}-${{ matrix.agent }}"
      - name: Launch demo
        if: matrix.agent == 'claude'
        run: |
          GOMMAGE_BIN=target/debug/gommage sh scripts/launch-demo.sh \
            --capture-dir "launch-demo-${{ matrix.os }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: operator-smoke-${{ matrix.os }}-${{ matrix.agent }}
          if-no-files-found: ignore
          path: |
            host-smoke-${{ matrix.os }}-${{ matrix.agent }}
            launch-demo-${{ matrix.os }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  semver-checks:
    name: cargo-semver-checks (gommage-core)
    runs-on: ubuntu-latest
    # Only run on PR-like refs against main — baseline is the target branch tip.
    # Release-please PRs created with GITHUB_TOKEN need the workflow_dispatch
    # fallback because their synchronize events do not start trusted PR jobs.
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0            # full history so baseline-rev can check out main
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Pre-fetch cargo registry for semver checks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --locked; then
              exit 0
            fi

            sleep $((attempt * 10))
          done
          cargo fetch --locked
      - name: Select intended release type
        id: semver-mode
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          echo "core=$(scripts/select-semver-release-type.sh \
            "origin/${BASE_REF}" crates/gommage-core)" >> "$GITHUB_OUTPUT"
          echo "audit=$(scripts/select-semver-release-type.sh \
            "origin/${BASE_REF}" crates/gommage-audit)" >> "$GITHUB_OUTPUT"
      - name: Check gommage-core public API
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: gommage-core
          release-type: ${{ steps.semver-mode.outputs.core }}
          # `gommage-core` is not on crates.io yet, so the default baseline
          # (latest published version) doesn't exist. Compare against the PR
          # target branch instead: any breaking API change vs that tip fails
          # the check. When we publish to crates.io, this line can go away
          # and the action reverts to the published-version baseline.
          #
          # Use the fully-qualified remote ref so the rev resolves without
          # needing a local branch (fetch-depth: 0 only brings remotes).
          baseline-rev: origin/${{ github.base_ref || 'main' }}
      - name: Check gommage-audit public API
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: gommage-audit
          release-type: ${{ steps.semver-mode.outputs.audit }}
          baseline-rev: origin/${{ github.base_ref || 'main' }}

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]') || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'release-please--branches--')) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          configFile: .commitlintrc.yaml
          failOnWarnings: true
      - name: Validate release dispatch commit headers
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          subjects="$(git log --format=%s origin/main..HEAD)"
          if [[ -z "${subjects}" ]]; then
            echo "::error::No commits found between origin/main and ${GITHUB_SHA}."
            exit 1
          fi

          allowed_types='feat|fix|chore|docs|refactor|perf|test|build|ci|revert|security'
          allowed_scopes='core|audit|stdlib|cli|daemon|mcp|policies|capabilities|hardstop|picto|runtime|docs|ci|deps|release|security|determinism'
          pattern="^(${allowed_types})(\\((${allowed_scopes})\\))?!?: [^ ].{0,}$"

          while IFS= read -r subject; do
            [[ -n "${subject}" ]] || continue

            if (( ${#subject} > 72 )); then
              echo "::error::Commit header exceeds 72 characters: ${subject}"
              exit 1
            fi

            if [[ ! "${subject}" =~ ${pattern} ]]; then
              echo "::error::Commit header is not conventional: ${subject}"
              exit 1
            fi

            if [[ "${subject}" == *. ]]; then
              echo "::error::Commit header must not end with a period: ${subject}"
              exit 1
            fi
          done <<< "${subjects}"

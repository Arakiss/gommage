# OSSF Scorecard — https://github.com/ossf/scorecard
#
# Produces a third-party signal about the repo's supply-chain posture:
# branch protection, token permissions, pinned deps, signed releases, SAST,
# dangerous workflows, and so on. Results land in the Security tab (SARIF
# upload) and, for public repos, in the public OpenSSF API consumed by deps.dev
# and the scorecard badge.
#
# Permissions are intentionally narrow. Private repositories need more than
# `contents: read` for Scorecard's GraphQL checks (for example ListCommits and
# SAST detection), but those scopes can stay read-only. Private repos skip
# public result publishing and SARIF upload because code scanning may be
# disabled; keeping those public-only avoids a red default branch for a missing
# GitHub feature flag.

name: scorecard

on:
  # Recomputes the score whenever branch-protection rules change so the
  # public signal stays truthful.
  branch_protection_rule:
  schedule:
    # Weekly, Saturday 01:30 UTC — outside the week's CI rush.
    - cron: '30 1 * * 6'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to the Security tab.
      security-events: write
      # Required for `publish_results: true` — the action uses OIDC to prove
      # to the OpenSSF publishing service that this run comes from this repo.
      id-token: write
      # Read-only repo access for private-repo Scorecard API/GraphQL checks.
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Do not persist the checkout token into the runner git config —
          # later steps should not inherit push capability.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to the public OpenSSF API for public repos.
          # Private repos keep the local analysis but avoid leaking or failing
          # on public-only publication paths.
          publish_results: ${{ github.event.repository.private == false }}

      - name: Upload SARIF to code scanning
        if: ${{ github.event.repository.private == false }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: results.sarif

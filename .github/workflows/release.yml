name: release

on:
  push:
    branches: [main]
    # Binary-build step triggers off the gommage-cli tag (the user-visible one).
    # Per-crate tags also exist (gommage-core-v*, …) but binaries live on cli.
    tags:
      - "gommage-cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to retroactively build + attach binaries to (e.g. gommage-cli-vX.Y.Z-beta.N)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) On push to main: run release-please. Opens / updates the release PR.
  #    When a CLI release is created, dispatch this workflow from the created
  #    tag so Sigstore identity remains tied to the release tag ref.
  #    Set the repository variable GOMMAGE_RELEASE_HOLD=true to pause release
  #    automation during repository maintenance while leaving normal CI active.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.GOMMAGE_RELEASE_HOLD != 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Verify internal workspace dependency pins
        run: sh scripts/sync-workspace-internal-deps.sh --check
      - name: Verify living docs avoid pinned release drift
        run: sh scripts/check-doc-release-refs.sh
      - name: Tag internal components without GitHub Releases
        run: sh scripts/tag-skipped-release-please-components.sh
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve active release PR
        id: release-pr
        if: ${{ steps.release.outputs.releases_created != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail

          pr_info="$(
            node <<'NODE'
          const candidates = [];
          for (const raw of [process.env.RELEASE_PR, process.env.RELEASE_PRS]) {
            if (!raw) continue;
            try {
              const parsed = JSON.parse(raw);
              candidates.push(...(Array.isArray(parsed) ? parsed : [parsed]));
            } catch (error) {
              console.error(`Could not parse Release Please PR output: ${error.message}`);
            }
          }

          const pr = candidates.find((item) => item && (item.number || item.id));
          if (pr) {
            const branch = pr.headRefName
              || pr.headBranchName
              || pr.branch
              || pr.head?.ref
              || "";
            console.log(`${pr.number || ""}\t${branch}`);
          }
          NODE
          )"

          if [[ -z "${pr_info}" ]]; then
            for attempt in 1 2 3 4 5 6; do
              pr_info="$(
                gh pr list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --state open \
                  --base main \
                  --label "autorelease: pending" \
                  --json number,headRefName,updatedAt \
                  --jq 'sort_by(.updatedAt) | last | select(. != null) | [.number, .headRefName] | @tsv' \
                  --limit 20
              )"

              [[ -n "${pr_info}" ]] && break
              sleep $((attempt * 5))
            done
          fi

          if [[ -z "${pr_info}" ]]; then
            echo "No active release PR was created or updated."
            exit 0
          fi

          pr_number="${pr_info%%$'\t'*}"
          pr_branch="${pr_info#*$'\t'}"
          if [[ -z "${pr_branch}" && -n "${pr_number}" ]]; then
            pr_branch="$(
              gh pr view "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json headRefName \
                --jq .headRefName
            )"
          fi

          if [[ -z "${pr_number}" || -z "${pr_branch}" ]]; then
            echo "::error::Active release PR metadata is incomplete."
            exit 1
          fi

          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "branch=${pr_branch}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release PR #${pr_number} on ${pr_branch}."
      - name: Sync generated release PR workspace pins
        if: ${{ steps.release-pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          gh pr checkout "${RELEASE_PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
          sh scripts/sync-workspace-internal-deps.sh

          if git diff --quiet -- Cargo.toml; then
            echo "Release PR workspace dependency pins already synchronized."
            exit 0
          fi

          git add Cargo.toml
          git commit -m "chore: sync workspace dependency pins"
          git push origin "HEAD:$(git branch --show-current)"
      - name: Trigger PR-associated checks for generated release PR
        if: ${{ steps.release-pr.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          workflows=(ci.yml audit.yml codeql.yml fuzz.yml)

          resolve_branch_head_sha() {
            local branch_head=""

            for attempt in 1 2 3 4 5 6; do
              branch_head="$(
                git ls-remote --heads origin "${RELEASE_PR_BRANCH}" \
                  | awk '{ print $1 }' \
                  | head -n 1
              )"

              if [[ -n "${branch_head}" ]]; then
                echo "${branch_head}"
                return
              fi

              sleep $((attempt * 5))
            done

            return 1
          }

          if ! pr_head_sha="$(resolve_branch_head_sha)"; then
            echo "::error::Release PR branch head could not be resolved."
            exit 1
          fi

          echo "Release PR #${RELEASE_PR_NUMBER} branch ${RELEASE_PR_BRANCH} is at ${pr_head_sha}."

          dispatch_workflow() {
            local workflow="$1"
            local existing_run=""
            local run_id=""
            local run_status=""
            local run_conclusion=""
            local previous_run_id="0"

            existing_run="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow}" \
                --branch "${RELEASE_PR_BRANCH}" \
                --event workflow_dispatch \
                --json databaseId,headSha,status,conclusion \
                --jq ".[] | select(.headSha == \"${pr_head_sha}\") | [.databaseId, .status, (.conclusion // \"\")] | @tsv" \
                --limit 20 \
                | head -n 1 \
                || true
            )"

            if [[ -n "${existing_run}" ]]; then
              IFS=$'\t' read -r run_id run_status run_conclusion <<< "${existing_run}"
              if [[ "${run_status}" != "completed" || "${run_conclusion}" == "success" ]]; then
                echo "${workflow} run ${run_id} already covers ${pr_head_sha} (${run_status}/${run_conclusion:-pending})."
                return
              fi
              previous_run_id="${run_id}"
            fi

            gh workflow run "${workflow}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${RELEASE_PR_BRANCH}"

            for attempt in 1 2 3 4 5 6; do
              run_id="$(
                gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow "${workflow}" \
                  --branch "${RELEASE_PR_BRANCH}" \
                  --event workflow_dispatch \
                  --json databaseId,headSha \
                  --jq ".[] | select(.headSha == \"${pr_head_sha}\" and .databaseId != ${previous_run_id}) | .databaseId" \
                  --limit 20 \
                  | head -n 1 \
                  || true
              )"

              if [[ -n "${run_id}" ]]; then
                echo "Dispatched ${workflow} run ${run_id} for ${pr_head_sha}."
                return
              fi

              sleep $((attempt * 5))
            done

            echo "::error::Could not verify ${workflow} dispatch for ${pr_head_sha}."
            return 1
          }

          for workflow in "${workflows[@]}"; do
            dispatch_workflow "${workflow}"
          done
      - name: Mark prereleases
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        shell: bash
        run: |
          set -euo pipefail

          tags="$(
            node <<'NODE'
          const outputs = JSON.parse(process.env.RELEASE_OUTPUTS);
          const tags = [...new Set(Object.entries(outputs)
            .filter(([key, value]) => {
              return (key === "tag_name" || key.endsWith("--tag_name"))
                && typeof value === "string"
                && (value.includes("-alpha.") || value.includes("-beta."));
            })
            .map(([, value]) => value))]
            .sort();
          for (const tag of tags) {
            console.log(tag);
          }
          NODE
          )"

          if [[ -z "${tags}" ]]; then
            echo "No prerelease tags emitted by release-please."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --prerelease --latest=false
          done <<< "${tags}"
      - name: Name CLI release as the Gommage product
        if: ${{ steps.release.outputs['crates/gommage-cli--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TAG: ${{ steps.release.outputs['crates/gommage-cli--tag_name'] }}
        shell: bash
        run: |
          set -euo pipefail

          version="${CLI_TAG#gommage-cli-v}"
          gh release edit "${CLI_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gommage v${version}" \
            --prerelease \
            --latest=false
      - name: Trigger CLI binary build
        if: ${{ steps.release.outputs['crates/gommage-cli--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TAG: ${{ steps.release.outputs['crates/gommage-cli--tag_name'] }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLI_TAG}" ]]; then
            echo "::error::Release Please reported a CLI release but did not emit a tag."
            exit 1
          fi

          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${CLI_TAG}" -f "tag=${CLI_TAG}"

  # 2) On tag push gommage-cli-v*: build cross-platform binaries, attach to
  #    that tag's GitHub release. release-please dispatches this job explicitly
  #    because GITHUB_TOKEN-created tag pushes do not recursively start another
  #    workflow run. It is also runnable manually via workflow_dispatch to
  #    retroactively build binaries for tags that predated this workflow.
  build-binaries:
    name: build (${{ matrix.target }})
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: gommage-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: gommage-aarch64-linux
          - os: macos-15
            target: x86_64-apple-darwin
            asset: gommage-x86_64-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            asset: gommage-aarch64-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # When workflow_dispatch-triggered, check out the tag provided via input.
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve and validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release builds are tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cross toolchain (linux-aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get update \
              && sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then
              break
            fi

            if [[ "${attempt}" == "3" ]]; then
              echo "::error::Failed to install Linux aarch64 cross toolchain after 3 attempts."
              exit 1
            fi

            sleep "$((attempt * 10))"
          done

          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]'    >  .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"'      >> .cargo/config.toml
      - name: Build release binaries
        timeout-minutes: 25
        run: cargo build --release --target ${{ matrix.target }} --workspace
      - name: Package + checksum
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}.tar.gz" \
              gommage gommage-daemon gommage-mcp
          cd "$GITHUB_WORKSPACE"
          (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" \
              > "${{ matrix.asset }}.tar.gz.sha256")
      - name: Upload unsigned build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.asset }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256

  # Repository code and dependency build scripts execute only in the read-only
  # job above. This job receives release authority but never checks out or
  # executes repository code: it validates, signs, attests, and uploads the
  # exact archives transferred through the workflow artifact service.
  publish-binaries:
    name: sign and publish binaries
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    needs: build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve and validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release signatures are tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "${GITHUB_ENV}"
          echo "SIGNER_IDENTITY=https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${expected_ref}" >> "${GITHUB_ENV}"
      - name: Download exact build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: dist
      - name: Validate release inventory and checksums
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            gommage-x86_64-linux
            gommage-aarch64-linux
            gommage-x86_64-darwin
            gommage-aarch64-darwin
          )
          for asset in "${expected[@]}"; do
            test -f "dist/${asset}.tar.gz"
            test -f "dist/${asset}.tar.gz.sha256"
            (cd dist && shasum -a 256 -c "${asset}.tar.gz.sha256")
          done

          actual_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${actual_count}" != "8" ]]; then
            echo "::error::Expected exactly eight unsigned build files, found ${actual_count}."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify every archive
        shell: bash
        run: |
          set -euo pipefail

          for artifact in dist/*.tar.gz; do
            bundle="${artifact}.sigstore.json"
            cosign sign-blob --yes "${artifact}" --bundle "${bundle}"
            cosign verify-blob "${artifact}" \
              --bundle "${bundle}" \
              --certificate-identity "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          done
      - name: Attest archive provenance
        id: attest-artifact-primary
        continue-on-error: true
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Retry archive provenance attestation
        if: ${{ steps.attest-artifact-primary.outcome == 'failure' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Upload verified release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${UPLOAD_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  build-release-evidence:
    name: build release evidence
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    env:
      UPLOAD_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - name: Resolve and validate release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release evidence is tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "$GITHUB_ENV"
      - name: Prepare evidence directory
        run: mkdir -p dist
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gommage-${{ env.UPLOAD_TAG }}.cdx.json
          output-file: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload unsigned release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json

  release-evidence:
    name: release evidence
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    needs:
      - publish-binaries
      - build-release-evidence
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve and validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release evidence is tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "${GITHUB_ENV}"
      - name: Download exact release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom-${{ github.sha }}
          path: dist
      - name: Validate release evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="dist/gommage-${UPLOAD_TAG}.cdx.json"
          test -s "${expected}"
          actual_count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${actual_count}" != "1" ]]; then
            echo "::error::Expected one SBOM file, found ${actual_count}."
            find dist -maxdepth 1 -type f -print
            exit 1
          fi
      - name: Upload SBOM release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${UPLOAD_TAG}" \
            "dist/gommage-${UPLOAD_TAG}.cdx.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
      - name: Attest SBOM provenance
        id: attest-sbom-primary
        continue-on-error: true
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json
      - name: Retry SBOM provenance attestation
        if: ${{ steps.attest-sbom-primary.outcome == 'failure' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json

  build-crates-publish-bundles:
    name: build crates.io publish bundles
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && vars.GOMMAGE_CRATES_IO_PUBLISH == 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    needs: release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 120
      CARGO_HTTP_MULTIPLEXING: false
      UPLOAD_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve and validate release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::crates.io publishing is tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "$GITHUB_ENV"
      - name: Verify internal workspace dependency pins
        run: sh scripts/sync-workspace-internal-deps.sh --check
      - name: Verify crates.io publish readiness
        run: sh scripts/check-crates-publish-readiness.sh
      - name: Build sealed crates.io publish bundles
        run: >-
          node scripts/prepare-crates-publish-bundles.mjs
          --output dist/crates-publish
          --source-sha "${GITHUB_SHA}"
          --cli-tag "${UPLOAD_TAG}"
      - name: Upload sealed crates.io publish bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crates-publish-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: dist/crates-publish

  # This job receives only a short-lived crates.io token. It has no checkout,
  # Rust toolchain, Cargo invocation, or repository script execution. The only
  # authorized mutation is uploading request bodies sealed by the build job.
  publish-crates:
    name: publish crates.io
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && vars.GOMMAGE_CRATES_IO_PUBLISH == 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    needs: build-crates-publish-bundles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      id-token: write
    env:
      UPLOAD_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Resolve and validate release tag
        shell: bash
        run: |
          set -euo pipefail
          expected_ref="refs/tags/${UPLOAD_TAG}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::crates.io publishing is tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
      - name: Download sealed crates.io publish bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: crates-publish-${{ github.sha }}
          path: publish-bundles
      - name: Validate sealed publish inventory and framing
        shell: bash
        run: |
          set -euo pipefail

          expected_names=(
            gommage-stdlib
            gommage-core
            gommage-audit
            gommage-cli
            gommage-daemon
            gommage-mcp
          )

          if find publish-bundles -mindepth 1 -type l -print -quit | grep -q .; then
            echo "::error::Publish bundle contains a symbolic link."
            exit 1
          fi
          if find publish-bundles -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::Publish bundle root contains a non-file entry."
            exit 1
          fi
          actual_count="$(find publish-bundles -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "${actual_count}" != "20" ]]; then
            echo "::error::Expected 20 sealed publish files, found ${actual_count}."
            find publish-bundles -mindepth 1 -maxdepth 1 -print
            exit 1
          fi

          (
            cd publish-bundles
            sha256sum --check --strict manifest.sha256
          )
          jq -e \
            --arg sha "${GITHUB_SHA}" \
            --arg tag "${UPLOAD_TAG}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '.format == "cargo-registry-publish-bundle-v1"
             and .registry_api == "https://crates.io/api/v1/crates/new"
             and .repository == $repository
             and .source_sha == $sha
             and .release_tag == $tag
             and .dirty == false
             and (.packages | length) == 6
             and (.packages | map(.order)) == [0, 1, 2, 3, 4, 5]' \
            publish-bundles/manifest.json >/dev/null
          jq -e \
            '.packages | map(.name) == [
              "gommage-stdlib",
              "gommage-core",
              "gommage-audit",
              "gommage-cli",
              "gommage-daemon",
              "gommage-mcp"
            ]' \
            publish-bundles/manifest.json >/dev/null

          for index in "${!expected_names[@]}"; do
            entry="$(jq -c ".packages[${index}]" publish-bundles/manifest.json)"
            name="$(jq -r .name <<<"${entry}")"
            version="$(jq -r .version <<<"${entry}")"
            if [[ "${name}" != "${expected_names[${index}]}" ]]; then
              echo "::error::Unexpected package at publish position ${index}: ${name}."
              exit 1
            fi
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid package version in publish inventory: ${version}."
              exit 1
            fi

            prefix="${name}-${version}"
            crate_file="$(jq -r .crate_file <<<"${entry}")"
            metadata_file="$(jq -r .metadata_file <<<"${entry}")"
            request_file="$(jq -r .request_file <<<"${entry}")"
            [[ "${crate_file}" == "${prefix}.crate" ]]
            [[ "${metadata_file}" == "${prefix}.metadata.json" ]]
            [[ "${request_file}" == "${prefix}.publish" ]]

            crate_path="publish-bundles/${crate_file}"
            metadata_path="publish-bundles/${metadata_file}"
            request_path="publish-bundles/${request_file}"
            for artifact in crate metadata request; do
              file_var="${artifact}_path"
              sha_var="${artifact}_sha256"
              size_var="${artifact}_size"
              artifact_path="${!file_var}"
              artifact_sha="$(jq -r ".${sha_var}" <<<"${entry}")"
              artifact_size="$(jq -r ".${size_var}" <<<"${entry}")"
              printf '%s  %s\n' "${artifact_sha}" "${artifact_path}" | sha256sum --check --strict -
              [[ "$(stat -c %s "${artifact_path}")" == "${artifact_size}" ]]
            done

            jq -e --arg name "${name}" --arg version "${version}" \
              '.name == $name and .vers == $version' \
              "${metadata_path}" >/dev/null

            metadata_size="$(stat -c %s "${metadata_path}")"
            encoded_metadata_size="$(od -An -tu4 -N4 "${request_path}" | tr -d ' ')"
            [[ "${encoded_metadata_size}" == "${metadata_size}" ]]
            dd if="${request_path}" bs=1 skip=4 count="${metadata_size}" status=none \
              | cmp -s - "${metadata_path}"

            crate_size_offset=$((4 + metadata_size))
            encoded_crate_size="$(
              dd if="${request_path}" bs=1 skip="${crate_size_offset}" count=4 status=none \
                | od -An -tu4 \
                | tr -d ' '
            )"
            crate_size="$(stat -c %s "${crate_path}")"
            [[ "${encoded_crate_size}" == "${crate_size}" ]]
            crate_offset=$((crate_size_offset + 4))
            [[ "$(stat -c %s "${request_path}")" == "$((crate_offset + crate_size))" ]]
            tail -c "+$((crate_offset + 1))" "${request_path}" | cmp -s - "${crate_path}"
          done

          cli_version="$(
            jq -r '.packages[] | select(.name == "gommage-cli") | .version' \
              publish-bundles/manifest.json
          )"
          [[ "${UPLOAD_TAG}" == "gommage-cli-v${cli_version}" ]]
      - name: Plan idempotent registry mutations
        id: registry-plan
        shell: bash
        run: |
          set -euo pipefail
          pending=false
          while IFS=$'\t' read -r name version crate_sha; do
            status="$(
              curl --silent --show-error \
                --user-agent 'gommage-crates-publish/1 (+https://github.com/Arakiss/gommage)' \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://crates.io/api/v1/crates/${name}/${version}"
            )"
            case "${status}" in
              200)
                published_crate="$(mktemp)"
                curl --fail --silent --show-error --location \
                  --user-agent 'gommage-crates-publish/1 (+https://github.com/Arakiss/gommage)' \
                  --output "${published_crate}" \
                  "https://crates.io/api/v1/crates/${name}/${version}/download"
                printf '%s  %s\n' "${crate_sha}" "${published_crate}" | sha256sum --check --strict -
                rm -f "${published_crate}"
                echo "skip ${name} ${version}: identical crate already published"
                ;;
              404)
                pending=true
                echo "publish ${name} ${version}: version is not present"
                ;;
              *)
                echo "::error::Unexpected crates.io status for ${name} ${version}: ${status:-000}."
                exit 1
                ;;
            esac
          done < <(
            jq -r '.packages[] | [.name, .version, .crate_sha256] | @tsv' \
              publish-bundles/manifest.json
          )
          echo "pending=${pending}" >> "${GITHUB_OUTPUT}"
      - name: Obtain short-lived crates.io token
        if: ${{ steps.registry-plan.outputs.pending == 'true' }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Upload only sealed registry request bodies
        if: ${{ steps.registry-plan.outputs.pending == 'true' }}
        env:
          CRATES_IO_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          auth_header="$(mktemp)"
          response_file="$(mktemp)"
          published_crate="$(mktemp)"
          trap 'rm -f "${auth_header}" "${response_file}" "${published_crate}"' EXIT
          printf 'Authorization: %s\n' "${CRATES_IO_TOKEN}" > "${auth_header}"
          unset CRATES_IO_TOKEN

          while IFS=$'\t' read -r name version request_file request_sha crate_sha; do
            request_path="publish-bundles/${request_file}"
            printf '%s  %s\n' "${request_sha}" "${request_path}" | sha256sum --check --strict -

            status="$(
              curl --silent --show-error \
                --user-agent 'gommage-crates-publish/1 (+https://github.com/Arakiss/gommage)' \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://crates.io/api/v1/crates/${name}/${version}"
            )"
            if [[ "${status}" == "200" ]]; then
              echo "skip ${name} ${version}: version became visible before upload"
            elif [[ "${status}" == "404" ]]; then
              upload_status="$(
                curl --silent --show-error \
                  --retry 5 \
                  --retry-all-errors \
                  --retry-max-time 600 \
                  --request PUT \
                  --header "@${auth_header}" \
                  --header 'Accept: application/json' \
                  --header 'Content-Type: application/octet-stream' \
                  --user-agent 'gommage-crates-publish/1 (+https://github.com/Arakiss/gommage)' \
                  --data-binary "@${request_path}" \
                  --output "${response_file}" \
                  --write-out '%{http_code}' \
                  'https://crates.io/api/v1/crates/new'
              )"
              if [[ ! "${upload_status}" =~ ^2[0-9][0-9]$ ]]; then
                echo "::error::crates.io rejected ${name} ${version} with HTTP ${upload_status:-000}."
                jq -c . "${response_file}" 2>/dev/null || sed -n '1,20p' "${response_file}"
                exit 1
              fi
              if ! jq -e 'type == "object"' "${response_file}" >/dev/null 2>&1; then
                echo "::error::crates.io returned a non-JSON success body for ${name} ${version}."
                sed -n '1,20p' "${response_file}"
                exit 1
              fi
              if jq -e '.errors and (.errors | length > 0)' "${response_file}" >/dev/null 2>&1; then
                echo "::error::crates.io returned API errors for ${name} ${version}."
                jq -c .errors "${response_file}"
                exit 1
              fi
              echo "uploaded ${name} ${version}"
            else
              echo "::error::Unexpected crates.io status for ${name} ${version}: ${status:-000}."
              exit 1
            fi

            visible=false
            for attempt in $(seq 1 30); do
              status="$(
                curl --silent --show-error \
                  --user-agent 'gommage-crates-publish/1 (+https://github.com/Arakiss/gommage)' \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  "https://crates.io/api/v1/crates/${name}/${version}"
              )"
              if [[ "${status}" == "200" ]]; then
                visible=true
                break
              fi
              [[ "${status}" == "404" ]]
              echo "wait ${name} ${version}: registry visibility attempt ${attempt}/30"
              sleep 10
            done
            if [[ "${visible}" != "true" ]]; then
              echo "::error::Timed out waiting for ${name} ${version} on crates.io."
              exit 1
            fi

            curl --fail --silent --show-error --location \
              --user-agent 'gommage-crates-publish/1 (+https://github.com/Arakiss/gommage)' \
              --output "${published_crate}" \
              "https://crates.io/api/v1/crates/${name}/${version}/download"
            printf '%s  %s\n' "${crate_sha}" "${published_crate}" | sha256sum --check --strict -
            echo "verified ${name} ${version}: registry bytes match sealed crate"
          done < <(
            jq -r '.packages[] | [.name, .version, .request_file, .request_sha256, .crate_sha256] | @tsv' \
              publish-bundles/manifest.json
          )

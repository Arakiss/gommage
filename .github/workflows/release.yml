name: release

on:
  push:
    branches: [main]
    # Binary-build step triggers off the gommage-cli tag (the user-visible one).
    # Per-crate tags also exist (gommage-core-v*, …) but binaries live on cli.
    tags:
      - "gommage-cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to retroactively build + attach binaries to (e.g. gommage-cli-vX.Y.Z-beta.N)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # 1) On push to main: run release-please. Opens / updates the release PR.
  #    When a CLI release is created, dispatch this workflow from the created
  #    tag so Sigstore identity remains tied to the release tag ref.
  #    Set the repository variable GOMMAGE_RELEASE_HOLD=true to pause release
  #    automation during repository maintenance while leaving normal CI active.
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && vars.GOMMAGE_RELEASE_HOLD != 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Verify internal workspace dependency pins
        run: sh scripts/sync-workspace-internal-deps.sh --check
      - name: Verify living docs avoid pinned release drift
        run: sh scripts/check-doc-release-refs.sh
      - name: Tag internal components without GitHub Releases
        run: sh scripts/tag-skipped-release-please-components.sh
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve active release PR
        id: release-pr
        if: ${{ steps.release.outputs.releases_created != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        shell: bash
        run: |
          set -euo pipefail

          pr_info="$(
            node <<'NODE'
          const candidates = [];
          for (const raw of [process.env.RELEASE_PR, process.env.RELEASE_PRS]) {
            if (!raw) continue;
            try {
              const parsed = JSON.parse(raw);
              candidates.push(...(Array.isArray(parsed) ? parsed : [parsed]));
            } catch (error) {
              console.error(`Could not parse Release Please PR output: ${error.message}`);
            }
          }

          const pr = candidates.find((item) => item && (item.number || item.id));
          if (pr) {
            const branch = pr.headRefName
              || pr.headBranchName
              || pr.branch
              || pr.head?.ref
              || "";
            console.log(`${pr.number || ""}\t${branch}`);
          }
          NODE
          )"

          if [[ -z "${pr_info}" ]]; then
            for attempt in 1 2 3 4 5 6; do
              pr_info="$(
                gh pr list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --state open \
                  --base main \
                  --label "autorelease: pending" \
                  --json number,headRefName,updatedAt \
                  --jq 'sort_by(.updatedAt) | last | select(. != null) | [.number, .headRefName] | @tsv' \
                  --limit 20
              )"

              [[ -n "${pr_info}" ]] && break
              sleep $((attempt * 5))
            done
          fi

          if [[ -z "${pr_info}" ]]; then
            echo "No active release PR was created or updated."
            exit 0
          fi

          pr_number="${pr_info%%$'\t'*}"
          pr_branch="${pr_info#*$'\t'}"
          if [[ -z "${pr_branch}" && -n "${pr_number}" ]]; then
            pr_branch="$(
              gh pr view "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json headRefName \
                --jq .headRefName
            )"
          fi

          if [[ -z "${pr_number}" || -z "${pr_branch}" ]]; then
            echo "::error::Active release PR metadata is incomplete."
            exit 1
          fi

          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "branch=${pr_branch}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release PR #${pr_number} on ${pr_branch}."
      - name: Sync generated release PR workspace pins
        if: ${{ steps.release-pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          gh pr checkout "${RELEASE_PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
          sh scripts/sync-workspace-internal-deps.sh

          if git diff --quiet -- Cargo.toml; then
            echo "Release PR workspace dependency pins already synchronized."
            exit 0
          fi

          git add Cargo.toml
          git commit -m "chore: sync workspace dependency pins"
          git push origin "HEAD:$(git branch --show-current)"
      - name: Trigger PR-associated checks for generated release PR
        if: ${{ steps.release-pr.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_PR_BRANCH: ${{ steps.release-pr.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          workflows=(ci.yml audit.yml codeql.yml fuzz.yml)

          resolve_branch_head_sha() {
            local branch_head=""

            for attempt in 1 2 3 4 5 6; do
              branch_head="$(
                git ls-remote --heads origin "${RELEASE_PR_BRANCH}" \
                  | awk '{ print $1 }' \
                  | head -n 1
              )"

              if [[ -n "${branch_head}" ]]; then
                echo "${branch_head}"
                return
              fi

              sleep $((attempt * 5))
            done

            return 1
          }

          if ! pr_head_sha="$(resolve_branch_head_sha)"; then
            echo "::error::Release PR branch head could not be resolved."
            exit 1
          fi

          echo "Release PR #${RELEASE_PR_NUMBER} branch ${RELEASE_PR_BRANCH} is at ${pr_head_sha}."

          dispatch_workflow() {
            local workflow="$1"
            local existing_run=""
            local run_id=""
            local run_status=""
            local run_conclusion=""
            local previous_run_id="0"

            existing_run="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow}" \
                --branch "${RELEASE_PR_BRANCH}" \
                --event workflow_dispatch \
                --json databaseId,headSha,status,conclusion \
                --jq ".[] | select(.headSha == \"${pr_head_sha}\") | [.databaseId, .status, (.conclusion // \"\")] | @tsv" \
                --limit 20 \
                | head -n 1 \
                || true
            )"

            if [[ -n "${existing_run}" ]]; then
              IFS=$'\t' read -r run_id run_status run_conclusion <<< "${existing_run}"
              if [[ "${run_status}" != "completed" || "${run_conclusion}" == "success" ]]; then
                echo "${workflow} run ${run_id} already covers ${pr_head_sha} (${run_status}/${run_conclusion:-pending})."
                return
              fi
              previous_run_id="${run_id}"
            fi

            gh workflow run "${workflow}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${RELEASE_PR_BRANCH}"

            for attempt in 1 2 3 4 5 6; do
              run_id="$(
                gh run list \
                  --repo "${GITHUB_REPOSITORY}" \
                  --workflow "${workflow}" \
                  --branch "${RELEASE_PR_BRANCH}" \
                  --event workflow_dispatch \
                  --json databaseId,headSha \
                  --jq ".[] | select(.headSha == \"${pr_head_sha}\" and .databaseId != ${previous_run_id}) | .databaseId" \
                  --limit 20 \
                  | head -n 1 \
                  || true
              )"

              if [[ -n "${run_id}" ]]; then
                echo "Dispatched ${workflow} run ${run_id} for ${pr_head_sha}."
                return
              fi

              sleep $((attempt * 5))
            done

            echo "::error::Could not verify ${workflow} dispatch for ${pr_head_sha}."
            return 1
          }

          for workflow in "${workflows[@]}"; do
            dispatch_workflow "${workflow}"
          done
      - name: Mark prereleases
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OUTPUTS: ${{ toJson(steps.release.outputs) }}
        shell: bash
        run: |
          set -euo pipefail

          tags="$(
            node <<'NODE'
          const outputs = JSON.parse(process.env.RELEASE_OUTPUTS);
          const tags = [...new Set(Object.entries(outputs)
            .filter(([key, value]) => {
              return (key === "tag_name" || key.endsWith("--tag_name"))
                && typeof value === "string"
                && (value.includes("-alpha.") || value.includes("-beta."));
            })
            .map(([, value]) => value))]
            .sort();
          for (const tag of tags) {
            console.log(tag);
          }
          NODE
          )"

          if [[ -z "${tags}" ]]; then
            echo "No prerelease tags emitted by release-please."
            exit 0
          fi

          while IFS= read -r tag; do
            [[ -n "${tag}" ]] || continue
            gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --prerelease --latest=false
          done <<< "${tags}"
      - name: Name CLI release as the Gommage product
        if: ${{ steps.release.outputs['crates/gommage-cli--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TAG: ${{ steps.release.outputs['crates/gommage-cli--tag_name'] }}
        shell: bash
        run: |
          set -euo pipefail

          version="${CLI_TAG#gommage-cli-v}"
          gh release edit "${CLI_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gommage v${version}" \
            --prerelease \
            --latest=false
      - name: Trigger CLI binary build
        if: ${{ steps.release.outputs['crates/gommage-cli--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLI_TAG: ${{ steps.release.outputs['crates/gommage-cli--tag_name'] }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CLI_TAG}" ]]; then
            echo "::error::Release Please reported a CLI release but did not emit a tag."
            exit 1
          fi

          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${CLI_TAG}" -f "tag=${CLI_TAG}"

  # 2) On tag push gommage-cli-v*: build cross-platform binaries, attach to
  #    that tag's GitHub release. release-please dispatches this job explicitly
  #    because GITHUB_TOKEN-created tag pushes do not recursively start another
  #    workflow run. It is also runnable manually via workflow_dispatch to
  #    retroactively build binaries for tags that predated this workflow.
  build-binaries:
    name: build (${{ matrix.target }})
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: gommage-x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset: gommage-aarch64-linux
          - os: macos-15
            target: x86_64-apple-darwin
            asset: gommage-x86_64-darwin
          - os: macos-15
            target: aarch64-apple-darwin
            asset: gommage-aarch64-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # When workflow_dispatch-triggered, check out the tag provided via input.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve and validate release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release signatures are verified against ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "$GITHUB_ENV"
          echo "SIGNER_IDENTITY=https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${expected_ref}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install cross toolchain (linux-aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get update \
              && sudo env DEBIAN_FRONTEND=noninteractive timeout 300s apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross; then
              break
            fi

            if [[ "${attempt}" == "3" ]]; then
              echo "::error::Failed to install Linux aarch64 cross toolchain after 3 attempts."
              exit 1
            fi

            sleep "$((attempt * 10))"
          done

          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]'    >  .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"'      >> .cargo/config.toml
      - name: Build release binaries
        timeout-minutes: 25
        run: cargo build --release --target ${{ matrix.target }} --workspace
      - name: Package + checksum
        shell: bash
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}.tar.gz" \
              gommage gommage-daemon gommage-mcp
          cd "$GITHUB_WORKSPACE"
          (cd dist && shasum -a 256 "${{ matrix.asset }}.tar.gz" \
              > "${{ matrix.asset }}.tar.gz.sha256")
      - name: Sign + verify artifact
        shell: bash
        run: |
          artifact="dist/${{ matrix.asset }}.tar.gz"
          bundle="${artifact}.sigstore.json"
          cosign sign-blob --yes "${artifact}" --bundle "${bundle}"
          cosign verify-blob "${artifact}" \
            --bundle "${bundle}" \
            --certificate-identity "${SIGNER_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      - name: Attest artifact provenance
        id: attest-artifact-primary
        continue-on-error: true
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/${{ matrix.asset }}.tar.gz
      - name: Retry artifact provenance attestation
        if: ${{ steps.attest-artifact-primary.outcome == 'failure' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/${{ matrix.asset }}.tar.gz
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.UPLOAD_TAG }}
          files: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
            dist/${{ matrix.asset }}.tar.gz.sigstore.json

  release-evidence:
    name: release evidence
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      UPLOAD_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve and validate release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release evidence is tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "$GITHUB_ENV"
      - name: Prepare evidence directory
        run: mkdir -p dist
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gommage-${{ env.UPLOAD_TAG }}.cdx.json
          output-file: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${UPLOAD_TAG}" \
            "dist/gommage-${UPLOAD_TAG}.cdx.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
      - name: Attest SBOM provenance
        id: attest-sbom-primary
        continue-on-error: true
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json
      - name: Retry SBOM provenance attestation
        if: ${{ steps.attest-sbom-primary.outcome == 'failure' }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: dist/gommage-${{ env.UPLOAD_TAG }}.cdx.json

  publish-crates:
    name: publish crates.io
    if: >
      vars.GOMMAGE_RELEASE_HOLD != 'true'
      && vars.GOMMAGE_CRATES_IO_PUBLISH == 'true'
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gommage-cli-v'))
        || github.event_name == 'workflow_dispatch'
      )
    needs: release-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 120
      CARGO_HTTP_MULTIPLEXING: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPLOAD_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Resolve and validate release tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            upload_tag="${{ github.event.inputs.tag }}"
          else
            upload_tag="${GITHUB_REF#refs/tags/}"
          fi
          expected_ref="refs/tags/${upload_tag}"
          if [[ "${GITHUB_REF}" != "${expected_ref}" ]]; then
            echo "::error::crates.io publishing is tied to ${expected_ref}, but this run identity is ${GITHUB_REF}. Re-run workflow_dispatch from the tag ref."
            exit 1
          fi
          echo "UPLOAD_TAG=${upload_tag}" >> "$GITHUB_ENV"
      - name: Verify crates.io token
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN:-}" ]]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required when GOMMAGE_CRATES_IO_PUBLISH=true."
            exit 1
          fi
      - name: Verify release assets before registry publish
        run: sh scripts/check-release-assets.sh --tag "$UPLOAD_TAG" --require-sbom
      - name: Verify crates.io publish readiness
        run: sh scripts/check-crates-publish-readiness.sh
      - name: Publish crates in dependency order
        run: sh scripts/publish-crates.sh --execute

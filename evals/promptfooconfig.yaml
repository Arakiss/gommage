description: Gommage agent-facing CLI evals

prompts:
  - "{{scenario}}"

providers:
  - id: file://./providers/gommage-cli.mjs
    label: local-gommage-cli

defaultTest:
  options:
    provider:
      # Every case exercises the user-facing CLI path against an isolated home.
      isolateHome: true

tests:
  - description: Codex quickstart dry-run reports widened default hook coverage
    vars:
      scenario: Codex quickstart coverage
      agent: codex
      argvJson: '["quickstart","--agent","codex","--dry-run","--json"]'
    assert:
      - type: javascript
        value: |
          const report = JSON.parse(output);
          if (report.exitCode !== 0) {
            return false;
          }
          const plan = report.json;
          const coverage = JSON.stringify(plan);
          return coverage.includes('Bash') && coverage.includes('apply_patch') && coverage.includes('MCP');

  - description: Codex apply_patch hook maps edited files to write capabilities
    vars:
      scenario: Codex apply_patch mapping
      agent: codex
      seedStdlib: true
      argvJson: '["map","--json","--hook"]'
      stdinJson: |
        {
          "hook_event_name": "PreToolUse",
          "tool_name": "apply_patch",
          "cwd": "/tmp/gommage-eval",
          "tool_input": {
            "command": "*** Begin Patch\n*** Update File: src/lib.rs\n*** Add File: docs/codex.md\n*** End Patch\n"
          }
        }
    assert:
      - type: javascript
        value: |
          const report = JSON.parse(output);
          if (report.exitCode !== 0) {
            return false;
          }
          const capabilities = report.json?.capabilities || [];
          return capabilities.includes('fs.write:/tmp/gommage-eval/src/lib.rs')
            && capabilities.includes('fs.write:/tmp/gommage-eval/docs/codex.md');

  - description: Codex MCP hook names map to MCP call and write capabilities
    vars:
      scenario: Codex MCP mapping
      agent: codex
      seedStdlib: true
      argvJson: '["map","--json","--hook"]'
      stdinJson: |
        {
          "hook_event_name": "PreToolUse",
          "tool_name": "mcp__github__create_issue",
          "cwd": "/tmp/gommage-eval",
          "tool_input": {
            "title": "Release note",
            "body": "Verify Gommage release evidence"
          }
        }
    assert:
      - type: javascript
        value: |
          const report = JSON.parse(output);
          if (report.exitCode !== 0) {
            return false;
          }
          const capabilities = report.json?.capabilities || [];
          return capabilities.includes('mcp.call:mcp__github__create_issue')
            && capabilities.includes('mcp.write:mcp__github__create_issue');

  - description: Harness explain keeps Codex sandbox boundary visible
    vars:
      scenario: Codex harness explanation
      agent: codex
      argvJson: '["harness","explain","--agent","codex"]'
    assert:
      - type: javascript
        value: |
          const report = JSON.parse(output);
          if (report.exitCode !== 0) {
            return false;
          }
          return report.stdout.includes('Codex sandbox remains authoritative')
            && report.stdout.includes('apply_patch')
            && !report.stdout.includes('not default-wired');

  - description: Release verification help exposes strict full-matrix evidence gate
    vars:
      scenario: Release verification strict evidence
      argvJson: '["release","verify","--help"]'
    assert:
      - type: javascript
        value: |
          const report = JSON.parse(output);
          if (report.exitCode !== 0) {
            return false;
          }
          return report.stdout.includes('--all-assets')
            && report.stdout.includes('--require-sbom')
            && report.stdout.includes('--require-provenance');

version: 1
cases:
  - name: hardstop_rm_root
    description: Compiled hard-stops must block destructive root deletion.
    tool: Bash
    input:
      command: rm -rf /
    expect:
      decision: gommage
      hard_stop: true

  - name: fail_closed_unmapped_tool
    description: Unknown tools must deny when no capability or policy rule matches.
    tool: UnknownTool
    input: {}
    expect:
      decision: gommage
      hard_stop: false

  - name: allow_feature_push
    description: Feature branch pushes should pass without requiring a picto.
    tool: Bash
    input:
      command: git push origin chore/test-branch
    expect:
      decision: allow
      matched_rule: allow-feature-push

  - name: ask_main_push
    description: Main branch pushes should require a signed git.push:main picto.
    tool: Bash
    input:
      command: git push origin main
    expect:
      decision: ask_picto
      required_scope: git.push:main
      matched_rule: gate-main-push

  - name: gate_force_push
    description: Force pushes are deny-by-default but unlockable with a signed git.push.force picto (break-glass), and no-force-push wins over the main-push gate.
    tool: Bash
    input:
      command: git push --force origin main
    expect:
      decision: ask_picto
      required_scope: git.push.force
      matched_rule: no-force-push

  - name: gate_delete_protected_branch_by_refspec
    description: An empty-source refspec deletes the remote branch. This used to be allowed because the ref capture emitted refs/heads/:main, which matched no branch gate, so deleting main slipped through while pushing to it did not.
    tool: Bash
    input:
      command: "git push origin :main"
    expect:
      decision: ask_picto
      required_scope: git.push.delete
      matched_rule: gate-remote-branch-delete

  - name: gate_delete_feature_branch_by_refspec
    description: Deleting any remote branch is gated, not only protected ones, because removing a colleague's branch destroys shared work even where pushing to it is allowed.
    tool: Bash
    input:
      command: "git push origin :feat/some-work"
    expect:
      decision: ask_picto
      required_scope: git.push.delete
      matched_rule: gate-remote-branch-delete

  - name: ask_web_fetch
    description: Agent-native web fetches cross the local trust boundary and should require approval.
    tool: WebFetch
    input:
      url: https://example.com/docs
    expect:
      decision: ask_picto
      required_scope: net.fetch
      matched_rule: ask-web-fetch

  - name: ask_mcp_write
    description: Write-like MCP tools should require explicit approval.
    tool: mcp__github__create_issue
    input:
      title: smoke
    expect:
      decision: ask_picto
      required_scope: mcp.write
      matched_rule: ask-mcp-write

  - name: deny_unparsed_codex_apply_patch
    description: Codex apply_patch payloads that cannot be parsed into file paths fail closed.
    tool: apply_patch
    input:
      __gommage_patch_unparsed: true
    expect:
      decision: gommage
      hard_stop: false
      matched_rule: deny-unsafe-apply-patch-payload
